name: fit_odyssey
description: "Fit Odyssey — AI-Powered Gamified Fitness App with On-Device Pose Tracking"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Hardware, Vision & Audio
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.12.0
  flutter_tts: ^4.0.2

  # Visualization
  fl_chart: ^0.68.0

  # Heritage Trek — Location & Maps
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Heritage Trek — Step Counting
  pedometer_2: ^5.0.4

  # Heritage Trek — Runtime Permissions
  permission_handler: ^11.3.1

  # Backend & Offline Persistence
  supabase_flutter: ^2.5.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
